<!DOCTYPE html>
<html>

<head>
    <title>Physics Sandbox</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body,
        html {
            height: 100%;
            overflow: hidden;
        }

        #canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>

<body>
    <canvas id="canvas">
        Your browser doesn't support canvas.
    </canvas>
    <script>
        window.onload = (event) => {
            /** @type{HTMLCanvasEvlement} */
            const canvas = document.querySelector("#canvas")

            /** @type{HTMLCanvasEvlement} */
            const backBuffer = document.createElement('canvas')

            /** @type{CanvasRenderingContext2D} */
            const frontBuffer = canvas.getContext("2d", {alpha: false})

            /** @type{CanvasRenderingContext2D} */
            const gfx = backBuffer.getContext("2d")

            /** @type{number} The target FPS. */
            const fps = 30

            /** @type{number} The duration of a simulation tick in milliseconds. */
            const millisPerTick = 1000 / fps

            /** @type{number} The duration of a simulation tick in seconds. */
            const dt = 1 / fps

            /** @type{number} The dt^2. */
            const dtSquared = dt * dt

            /** @type{DOMHighResTimeStamp} */
            var prevTimestamp = performance.now()

            /** 
             * @param{number} start - The lower bound of the range of numbers.
             * @param{number} stop  - The upper bound of the range of numbers.
             * @return{number} A number number in the range from `start` to `stop`, inclusive.
             */
            const randomNumberBetween = (start, stop) => {
                return start + Math.random() * (stop - start)
            }

            /**
             * @class
             * @param{number} x - The x coordinate of the vector.
             * @param{number} y - The y coordinate of the vector.
             */
            const Vector2D = function (x, y) {
                this.x = x
                this.y = y

                this.add = (x, y) => {
                    if (x instanceof Vector2D) {
                        this.x += x.x
                        this.y += x.y
                    } else {
                        this.x += x
                        this.y += y
                    }
                    return this
                }

                this.sub = (x, y) => {
                    if (x instanceof Vector2D) {
                        this.x -= x.x
                        this.y -= x.y
                    } else {
                        this.x -= x
                        this.y -= y
                    }
                    return this
                }

                this.mul = (s) => {
                    this.x *= s
                    this.y *= s
                    return this
                }

                this.div = (s) => {
                    this.x /= s
                    this.y /= s
                    return this
                }

                this.magSquared = () => {
                    return this.x * this.x + this.y * this.y
                }

                this.mag = () => {
                    return Math.sqrt(this.magSquared())
                }

                this.normalize = () => {
                    const mag = this.mag()
                    if (mag === 0) {
                        this.x = 0
                        this.y = 0
                    } else {
                        this.div(mag)
                    }
                    return this
                }

                this.dir = () => {
                    return this.copy().normalize()
                }

                this.copy = () => {
                    return new Vector2D(this.x, this.y)
                }

                this.set = (x, y) => {
                    if (x instanceof Vector2D) {
                        this.x = x.x
                        this.y = x.y
                    } else {
                        this.x = x
                        this.y = y
                    }
                    return this
                }
            }
            Vector2D.zero = () => {
                return new Vector2D(0, 0)
            }

            /**
             * @class
             * @param{number|Vector2D} x
             * @param{number} [y]
             */
            const Vertex = function (x, y) {
                if (x instanceof Vector2D) {
                    this.currPosition = x.copy()
                    this.prevPosition = x.copy()
                } else {
                    this.currPosition = new Vector2D(x, y)
                    this.prevPosition = new Vector2D(x, y)
                }
                this.acceleration = Vector2D.zero()
                this.mass = 1

                this.apply = (f) => {
                    // TODO: Apply only those forces, we are intersted in.
                    this.acceleration
                        .add(f.applyTo(this))
                }

                this.update = () => {
                    // Stormer-Verlet integration:
                    //  pos = pos * 2 - prev_pos + acc * dt * dt 
                    const positionBeforeUpdate = this.currPosition.copy()
                    this.currPosition
                        .mul(2)
                        .sub(this.prevPosition)
                        .add(this.acceleration.mul(dtSquared))
                    this.prevPosition = positionBeforeUpdate
                    this.acceleration.set(0, 0)
                }

                const visualExtent = 2
                const visualSize = visualExtent * 2

                this.draw = () => {
                    const topLeftCorner = this.currPosition.copy()
                    topLeftCorner.sub(visualExtent, visualExtent)
                    gfx.fillRect(topLeftCorner.x, topLeftCorner.y, visualSize, visualSize)
                }
            }

            /**
             * @class
             * @param{number|Vector2D} x
             * @param{number} [y]
             */
            const Gravity = function (x, y) {
                if (x instanceof Vector2D) {
                    this.vector = x.copy()
                } else {
                    this.vector = new Vector2D(x, y)
                }

                /** 
                 * @returns{Vector2D} The vertex acceleration.
                 */
                this.applyTo = (vertex) => {
                    return this.vector.copy().div(vertex.mass)
                }
            }

            /**
             * @class
             * @param{number|Vector2D} x
             * @param{number} [y]
             * @param{number} [mag]
             */
            const ForceField = function (x, y, mag) {
                if (x instanceof Vector2D) {
                    this.center = x.copy()
                    this.mag = x
                } else {
                    this.center = new Vector2D(x, y)
                    this.mag = mag
                }

                /**
                 * @returns{Vector2D} The vertex acceleration.
                 */
                this.applyTo = (vertex) => {
                    return this.center
                        .copy()
                        .sub(vertex.currPosition)
                        .normalize()
                        .mul(this.mag / vertex.mass)
                }

                this.draw = () => {
                    gfx.beginPath()
                    gfx.moveTo(this.center.x + 8, this.center.y + 0)
                    gfx.lineTo(this.center.x + 0, this.center.y + 8)
                    gfx.lineTo(this.center.x - 8, this.center.y + 0)
                    gfx.lineTo(this.center.x + 0, this.center.y - 8)
                    gfx.closePath()
                    gfx.stroke()
                }
            }

            /**
             * @class
             */
            const Spring = function (v0, v1, stiffness) {
                this.v0 = v0
                this.v1 = v1

                this.length = () => {
                    return this.v0.currPosition
                        .copy()
                        .sub(this.v1.currPosition)
                        .mag()
                }

                this.restLength = this.length()
                this.stiffness = stiffness || 1

                this.applyConstraint = () => {
                    const forceMagnitude = this.stiffness * this.length() / this.restLength
                    const forceDirection = this.v0.currPosition
                        .copy()
                        .sub(this.v1.currPosition)
                        .normalize()
                    const totalMass = this.v0.mass + this.v2.mass
                    const v0Contribution = this.v0.mass / totalMass
                    const v1Contribution = this.v1.mass / totalMass
                    this.v0.currPosition.add(
                        forceDirection
                            .copy()
                            .mul(-forceMagnitude * v0Contribution))
                    this.v1.currPosition.add(
                        forceDirection
                            .copy()
                            .mul(forceMagnitude * v1Contribution))
                }

                this.draw = () => {
                    gfx.beginPath()
                    gfx.moveTo(this.v0.currPosition.x, this.v0.currPosition.y)
                    gfx.lineTo(this.v1.currPosition.x, this.v1.currPosition.y)
                    gfx.stroke()
                }
            }

            /**
             * @class
             */
            const Pin = function(vertex) {
                this.vertex = vertex
                this.vertexPosition = vertex.currPosition.copy()

                this.applyConstraint = () => {
                    this.vertex.currPosition = this.vertexPosition.copy()
                }

                this.draw = () => {
                    gfx.beginPath()
                    gfx.moveTo(this.vertexPosition.x - 8, this.vertexPosition.y)
                    gfx.lineTo(this.vertexPosition.x + 8, this.vertexPosition.y)
                    gfx.moveTo(this.vertexPosition.x, this.vertexPosition.y - 8)
                    gfx.lineTo(this.vertexPosition.x, this.vertexPosition.y + 8)
                    gfx.stroke()
                }
            }

            var
                vertexCount = 0,
                springCount = 0,
                /** @type{Pin} */
                pin = null
            const
                gravity = new Gravity(0, 16),
                attractor = new ForceField(300, 300, 32),
                /** @type{Vertex[]} */
                vertices = [],
                /** @type{Spring[]} */
                springs = []

            const addVertex = (x, y) => {
                vertexCount += 1
                const newVertex = new Vertex(x, y)
                if (vertices.length > 0) {
                    springCount += 1
                    const newSpring = new Spring(newVertex, vertices[vertices.length - 1])
                    springs.push(newSpring)
                } else {
                    pin = new Pin(newVertex)
                }
                vertices.push(newVertex)
            }

            const applyForces = () => {
                for (var i = 0; i < vertexCount; i++) {
                    vertices[i].apply(gravity)
                    vertices[i].apply(attractor)
                }
                for (var i = 0; i < springCount; i++) {
                    springs[i].applyConstraint()
                }
                if (pin !== null) {
                    pin.applyConstraint()
                }
            }

            const updateVertices = () => {
                for (var i = 0; i < vertexCount; i++) {
                    vertices[i].update()
                }
            }

            const drawVertices = () => {
                gfx.fillStyle = 'red'
                for (var i = 0; i < vertexCount; i++) {
                    vertices[i].draw()
                }
            }

            const drawForcesAndConstraints = () => {
                gfx.fillStyle = 'yellow'
                attractor.draw()
                if (pin !== null) {
                    pin.draw()
                }
                for (var i = 0; i < springCount; i++) {
                    springs[i].draw()
                }
            }

            const drawStats = () => {
                gfx.fillStyle = 'rgba(100, 100, 100, 0.4)'
                gfx.fillRect(0, 0, 200, 200)
                gfx.fillStyle = 'black'
                gfx.fillText(`Vertex Count: ${vertexCount}`, 22, 22, 200)
                gfx.fillStyle = 'white'
                gfx.fillText(`Vertex Count: ${vertexCount}`, 20, 20, 200)
            }

            const updateGameWorld = () => {
                applyForces()
                updateVertices()
            }

            const drawGameWorld = () => {
                // Clear the back buffer.
                gfx.fillStyle = '#c5f2f7'
                gfx.fillRect(0, 0, backBuffer.width, backBuffer.height)
                // Draw the world.
                drawVertices()
                drawForcesAndConstraints()
                drawStats()
                // Present the back buffer on screen.
                frontBuffer.drawImage(backBuffer, 0, 0)
            }

            /** @param{DOMHighResTimeStamp} currTimestamp */
            const gameLoop = (currTimestamp) => {
                // Update the game time.
                const elapsedMillis = currTimestamp - prevTimestamp
                const tickCount = Math.floor(elapsedMillis / millisPerTick)
                prevTimestamp += (tickCount * millisPerTick)
                // Update the game world as many times as many ticks have elapsed.
                for (var i = 0; i < tickCount; i++) {
                    updateGameWorld()
                }
                // Render the game world once.
                if (tickCount != 0) {
                    drawGameWorld()
                }
                window.requestAnimationFrame(gameLoop)
            }

            const resizeCavnas = () => {
                // Get the DPR and size of the canvas
                const dpr = window.devicePixelRatio
                const displayWidth = canvas.clientWidth
                const displayHeight = canvas.clientHeight

                // Set the "actual" size of the canvas
                canvas.width = canvas.clientWidth * dpr
                canvas.height = canvas.clientHeight * dpr
                backBuffer.width = canvas.width
                backBuffer.height = canvas.height

                // Scale the context to ensure correct drawing operations
                gfx.scale(dpr, dpr)
            }

            /**
             * @param{MouseEvent}
             */
            canvas.onmousedown = (event) => {
                const mousePos = new Vector2D(event.clientX, event.clientY)
                const canvasRect = canvas.getBoundingClientRect()
                mousePos.sub(canvasRect.x, canvasRect.y)
                addVertex(mousePos)
            }

            window.onresize = (event) => {
                resizeCavnas()
            }

            resizeCavnas()
            gameLoop(performance.now())
        }
    </script>
</body>

</html>
