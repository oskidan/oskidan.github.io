<!DOCTYPE html>
<html>
    <head>
        <title>Physics Sandbox</title>
    </head>
    <body>
        <canvas id="canvas" width="100%" height="100%">
            Your browser doesn't support canvas.
        </canvas>
        <script>
            window.onload = (event) => {
                /** @type{HTMLCanvasEvlement} */
                const canvas = document.querySelector("#canvas")

                /** @type{CanvasRenderingContext2D} */
                const gfx = canvas.getContext("2d")

                /** @type{DOMHighResTimeStamp} */
                var prevTimestamp = performance.now()

                /** 
                 * @param{number} start - The lower bound of the range of numbers.
                 * @param{number} stop  - The upper bound of the range of numbers.
                 * @return{number} A number number in the range from `start` to `stop`, inclusive.
                 */
                const randomNumberBetween = (start, stop) => {
                    return start + Math.random() * (stop - start)
                }

                /** @param{DOMHighResTimeStamp} currentTimestamp */
                const gameLoop = (currentTimestamp) => {
                    const r = randomNumberBetween(100, 255)
                    const g = randomNumberBetween(100, 255)
                    const b = randomNumberBetween(100, 255)
                    gfx.fill = `rgb(${r}, ${g}, ${b})`
                    gfx.fillRect(0, 0, 100, 100)
                    window.requestAnimationFrame(gameLoop)
                }

                gameLoop()
            }
        </script>
    </body>
</html>
