<!DOCTYPE html>
<html>
    <head>
        <title>Physics Sandbox</title>
        <style>
            * {
                margin: 0;
                padding: 0;
            }
            body, html {
                height: 100%;
                overflow: hidden;
            }
            #canvas {
                position: absolute;
                width: 100%;
                height: 100%;
                display: block;
            }
        </style>
    </head>
    <body>
        <canvas id="canvas">
            Your browser doesn't support canvas.
        </canvas>
        <script>
            window.onload = (event) => {
                /** @type{HTMLCanvasEvlement} */
                const canvas = document.querySelector("#canvas")

                /** @type{HTMLCanvasEvlement} */
                const backBuffer = document.createElement('canvas')

                /** @type{CanvasRenderingContext2D} */
                const frontBuffer = canvas.getContext("2d", { alpha: false })
                
                /** @type{CanvasRenderingContext2D} */
                const gfx = backBuffer.getContext("2d")

                /** @type{number} The target FPS. */
                const fps = 30

                /** @type{number} The duration of a simulation tick in milliseconds. */
                const millisPerTick = 1000 / fps

                /** @type{number} The duration of a simulation tick in seconds. */
                const dt = 1 / fps

                /** @type{number} The dt^2. */
                const dtSquared = dt * dt

                /** @type{DOMHighResTimeStamp} */
                var prevTimestamp = performance.now()

                /** 
                 * @param{number} start - The lower bound of the range of numbers.
                 * @param{number} stop  - The upper bound of the range of numbers.
                 * @return{number} A number number in the range from `start` to `stop`, inclusive.
                 */
                const randomNumberBetween = (start, stop) => {
                    return start + Math.random() * (stop - start)
                }

                /**
                 * @class
                 * @param{number} x - The x coordinate of the vector.
                 * @param{number} y - The y coordinate of the vector.
                 */
                const vec2 = function(x, y) {
                    this.x = x
                    this.y = y

                    this.add = (x, y) => {
                        if (x instanceof vec2) {
                            this.x += x.x
                            this.y += x.y
                            return this
                        }
                        this.x += x
                        this.y += y
                        return this
                    }

                    this.sub = (x, y) => {
                        if (x instanceof vec2) {
                            this.x -= x.x
                            this.y -= x.y
                            return this
                        }
                        this.x -= x
                        this.y -= y
                        return this
                    }

                    this.mul = (s) => {
                        this.x *= s
                        this.y *= s
                        return this
                    }

                    this.copy = () => {
                        return new vec2(this.x, this.y)
                    }
                }
                vec2.zero = () => { 
                    return new vec2(0, 0)
                }

                var
                    /** @type{number} */
                    vertexCount = 0
                const
                    /** @type{vec2} */
                    gravity = new vec2(0, 9),
                    /** @type{vec2[]} */
                    vertexCurrPosition = [],
                    /** @type{vec2[]} */
                    vertexPrevPosition = [],
                    /** @type{vec2[]} */
                    vertexAcceleration = []

                const addVertex = (x, y) => {
                    vertexCount += 1
                    vertexAcceleration.push(vec2.zero())
                    if (x instanceof vec2) {
                        vertexCurrPosition.push(x.copy())
                        vertexPrevPosition.push(x.copy())
                    } else {
                        vertexCurrPosition.push(new vec2(x, y))
                        vertexPrevPosition.push(new vec2(x, y))
                    }
                }

                const applyForces = () => {
                    for (var i = 0; i < vertexCount; i++) {
                        vertexAcceleration[i] = gravity.copy()
                    }
                }

                const updateVertices = () => {
                    for (var i = 0; i < vertexCount; i++) {
                        // Stormer-Verlet integration:
                        //  pos = pos * 2 - prev_pos + acc * dt * dt
                        const vertexPosition = vertexCurrPosition[i].copy()
                        vertexCurrPosition[i]
                            .mul(2)
                            .sub(vertexPrevPosition[i])
                            .add(vertexAcceleration[i].mul(dtSquared))
                        vertexPrevPosition[i] = vertexPosition
                    }
                }

                const drawVertices = () => {
                    gfx.fillStyle = 'red'
                    for (var i = 0; i < vertexCount; i++) {
                        const cornerTL = vertexCurrPosition[i].copy()
                        cornerTL.sub(8, 8)
                        gfx.fillRect(cornerTL.x, cornerTL.y, 16, 16)
                    }
                }

                const drawStats = () => {
                    gfx.fillStyle = 'rgba(100, 100, 100, 0.4)'
                    gfx.fillRect(0, 0, 200, 200)
                    gfx.fillStyle = 'black'
                    gfx.fillText(`Vertex Count: ${vertexCount}`, 22, 22, 200)
                    gfx.fillStyle = 'white'
                    gfx.fillText(`Vertex Count: ${vertexCount}`, 20, 20, 200)
                }

                const updateGameWorld = () => {
                    applyForces()
                    updateVertices()
                }

                const drawGameWorld = () => {
                    // Clear the back buffer.
                    gfx.fillStyle = 'rgb(200, 100, 255)'
                    gfx.fillRect(0, 0, backBuffer.width, backBuffer.height)
                    // Draw the world.
                    drawVertices()
                    drawStats()
                    // Present the back buffer on screen.
                    frontBuffer.drawImage(backBuffer, 0, 0)
                }

                /** @param{DOMHighResTimeStamp} currTimestamp */
                const gameLoop = (currTimestamp) => {
                    // Update the game time.
                    const elapsedMillis = currTimestamp - prevTimestamp
                    const tickCount = Math.floor(elapsedMillis / millisPerTick)
                    prevTimestamp += (tickCount * millisPerTick)
                    // Update the game world as many times as many ticks have elapsed.
                    for (var i = 0; i < tickCount; i++) {
                        updateGameWorld()
                    }
                    // Render the game world once.
                    if (tickCount != 0) {
                        drawGameWorld()
                    }
                    window.requestAnimationFrame(gameLoop)
                }
                /* From MDN:
                // Get the DPR and size of the canvas
                const dpr = window.devicePixelRatio;
                const rect = canvas.getBoundingClientRect();

                // Set the "actual" size of the canvas
                canvas.width = rect.width * dpr;
                canvas.height = rect.height * dpr;

                // Scale the context to ensure correct drawing operations
                ctx.scale(dpr, dpr);

                // Set the "drawn" size of the canvas
                canvas.style.width = `${rect.width}px`;
                canvas.style.height = `${rect.height}px`;
*/
                const resizeCavnas = () => {
                    // Get the DPR and size of the canvas
                    const dpr = window.devicePixelRatio
                    const rect = canvas.getBoundingClientRect()

                    // Set the "actual" size of the canvas
                    canvas.width = rect.width * dpr
                    canvas.height = rect.height * dpr
                    backBuffer.width = canvas.width
                    backBuffer.height = canvas.height

                    // Scale the context to ensure correct drawing operations
                    gfx.scale(dpr, dpr)

                    // Set the "drawn" size of the canvas
                    canvas.style.width = `${rect.width}px`
                    canvas.style.height = `${rect.height}px`
                }

                const resizeCavnasOld = () => {
                    // 1. Get the actual display size from the browser layout
                    const displayWidth = canvas.clientWidth;
                    const displayHeight = canvas.clientHeight;

                    // 2. Sync internal drawing resolution to match display size
                    if (canvas.width !== displayWidth || canvas.height !== displayHeight) {
                      canvas.width = displayWidth;
                      canvas.height = displayHeight;
                      backBuffer.width = displayWidth
                      backBuffer.height = displayHeight
                    }
                }

                /**
                 * @param{MouseEvent}
                 */
                canvas.onmousedown = (event) => {
                    const mousePos = new vec2(event.clientX, event.clientY)
                    const canvasRect = canvas.getBoundingClientRect()
                    mousePos.sub(canvasRect.x, canvasRect.y)
                    addVertex(mousePos)
                }

                window.onresize = (event) => {
                    resizeCavnas()
                }

                resizeCavnas()
                gameLoop(performance.now())
            }
        </script>
    </body>
</html>
